<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="作業ブリーフ">
  <title>作業ブリーフ</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <div id="lock" class="lock"><form id="unlockForm" class="lock-box"><div class="lamp"></div><div class="eyebrow">PRIVATE WORKSPACE</div><h1>作業ブリーフ</h1><p>合言葉を入力すると、この端末だけで開けます。</p><label class="sr-only" for="passphrase">合言葉</label><input id="passphrase" type="password" autocomplete="current-password" placeholder="合言葉"><button class="primary" type="submit">開く</button><p id="lockError" class="error" aria-live="polite"></p></form></div>
  <div id="app" class="app hidden">
    <header class="top"><div><div class="brand"><i></i>作業ブリーフ</div><div id="updated" class="updated">最終更新: —</div></div><div class="top-actions"><button id="searchButton" class="icon-button" aria-label="検索">⌕</button><button id="settingsButton" class="icon-button" aria-label="設定">⚙</button></div></header>
    <main id="view" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="主な画面"><button data-page="today" class="active"><span>☀</span>今日</button><button data-page="tasks"><span>✓</span>タスク</button><button data-page="threads"><span>▣</span>案件</button><button data-page="people"><span>♙</span>人物</button><button data-page="daily"><span>▤</span>記録</button><button data-page="knowledge"><span>◇</span>ナレッジ</button></nav>
  </div>
  <div id="sheetBack" class="sheet-back"></div><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="選択"></section>
  <script src="js/app.js"></script>
</body></html>
